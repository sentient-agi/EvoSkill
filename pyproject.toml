[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evoskill"
version = "2.0.0"
description = "EvoSkill v2: an evolver agent rewrites a Claude Code solver's skills from the solver's own rollouts"
readme = "README.md"
license = "Apache-2.0"
# The reported runs used CPython 3.13.9 on the host (the loop and the Daytona drivers) and on the machine (the
# grader's /opt/evoskill/venv).
requires-python = ">=3.12"
# Derived from the shipped modules' imports. The host side of a run (src/orchestrator, scripts/daytona,
# scripts/cc_solver, scripts/tau3_cc) is standard library apart from the Daytona extra below. openpyxl and pydantic
# are imported at module scope by the SpreadsheetBench v2 grading code (src/agent_profiles/ssbv2_agent), which the
# pool machine runs under its own pinned venv (/opt/evoskill/venv, scripts/daytona/Dockerfile.ssb_leg) and the tests
# import on the host. lxml and
# defusedxml are not imported by our code: openpyxl switches its XML backend on their presence, and the grading
# venv has both, so the host reads workbooks the way the grader does.
dependencies = [
    "openpyxl>=3.1.5",
    "lxml",
    "defusedxml",
    "pydantic>=2.12",
]

[project.optional-dependencies]
# The machine backend the reported runs used. python-dotenv is imported at module scope by the three
# scripts/daytona/daytona_lib*.py (DAYTONA_* from a .env file), and the SDK lazily by every driver that creates a
# machine. Pinned to the SDK version of the reported runs.
daytona = [
    "daytona==0.211.2",
    "python-dotenv",
]
# Optional Phoenix tracing, read only by the OpenRouter solver runner (scripts/run_ssbv2_base30_dsv4f_n3.py).
# A Claude Code run does not use it. Needs a Phoenix server at PHOENIX_ENDPOINT.
phoenix = [
    "arize-phoenix-otel>=0.15",
    "openinference-semantic-conventions>=0.1.28",
    "opentelemetry-api>=1.40",
    "opentelemetry-sdk>=1.40",
]

[project.scripts]
evoskill = "src.run:main"
evoskill-loop = "src.orchestrator.loop:main"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pyflakes>=3.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
